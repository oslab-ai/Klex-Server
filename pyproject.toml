[project]
name = "klex"
version = "0.1.0"
description = "Project Klex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "dj-database-url>=2.1",
    "pyyaml>=6.0",
    "langchain>=1.2.18",
    "langchain-openai>=1.2.1",
    "pytz>=2026.2",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=3.1.8",
]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "klex.settings"
python_files = ["test_*.py", "*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["backend/klex"]

