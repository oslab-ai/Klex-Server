services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-klex}"]
      interval: 5s
      timeout: 3s
      retries: 5

  klex-backend:
    image: projectklexadmin/klex-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klex-backend
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override DB host to use Docker service name instead of localhost
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-klex}
      # Java/Spring datasource (points to Docker DB service)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-klex}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # Java runs inside same container
      - COMPILER_SERVICE_URL=http://localhost:8081
      - SCHEDULER_SERVICE_URL=http://localhost:8081
    volumes:
      - media_data:/app/backend/media
    ports:
      - "8000:8000"
      - "8081:8081"
    restart: unless-stopped

  frontend:
    image: projectklexadmin/klex-server-ui:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: klex-frontend
    env_file: .env
    environment:
      - VITE_API_BASE_URL=http://klex-backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - klex-backend

volumes:
  db_data:
  media_data: