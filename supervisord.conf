[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:java]
command=java -jar /app/java/app.jar
    --server.port=8081
    --spring.datasource.url=%(ENV_SPRING_DATASOURCE_URL)s
    --spring.datasource.username=%(ENV_SPRING_DATASOURCE_USERNAME)s
    --spring.datasource.password=%(ENV_SPRING_DATASOURCE_PASSWORD)s
    --spring.mail.host=%(ENV_SPRING_MAIL_HOST)s
    --spring.mail.port=%(ENV_SPRING_MAIL_PORT)s
    --spring.mail.username=%(ENV_SPRING_MAIL_USERNAME)s
    --spring.mail.password=%(ENV_SPRING_MAIL_PASSWORD)s
directory=/app/java
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
startsecs=10

[program:django]
command=/app/.venv/bin/gunicorn klex.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --chdir /app/backend
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startsecs=5

; ─────────────────────────────────────────────────────────────
; Apache Airflow services
; Only started when SCHEDULER_ENGINE=airflow (controlled by entrypoint)
; ─────────────────────────────────────────────────────────────

[program:airflow-scheduler]
command=/app/.venv/bin/airflow scheduler
directory=/app/backend
environment=AIRFLOW_HOME="/app/backend/airflow_home"
autostart=%(ENV_AIRFLOW_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
startsecs=10

[program:airflow-webserver]
command=/app/.venv/bin/airflow webserver --port 8080
directory=/app/backend
environment=AIRFLOW_HOME="/app/backend/airflow_home"
autostart=%(ENV_AIRFLOW_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=31
startsecs=10

[program:dispatch-worker]
command=/app/.venv/bin/python /app/backend/manage.py dispatch_jobs
directory=/app/backend
autostart=%(ENV_AIRFLOW_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
startsecs=5

[program:reconcile-worker]
command=/app/.venv/bin/python /app/backend/manage.py reconcile_airflow --retry
directory=/app/backend
autostart=%(ENV_AIRFLOW_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=41
startsecs=5
